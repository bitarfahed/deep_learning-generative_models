[project]
name = "deep-learning-generative-models"
version = "0.1.0"
description = "Portfolio project for deep learning and generative modeling with image reconstruction and generation experiments."
requires-python = ">=3.11"
dependencies = [
    "matplotlib>=3.8",
    "torch>=2.0",
    "torchvision>=0.15",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
